name: continuous-build

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to build and publish
        type: choice
        required: true
        default: experiment
        options:
          - experiment
          - event-hub
          - ingestor
          - query
  push:
    paths:
      - 'code/**'
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: continuous-build-${{ matrix.component }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        component:
          - ${{ inputs.component || 'experiment' }}
    env:
      folder: ${{ fromJSON('{"experiment":"EventHubExperiment","event-hub":"EventHub","ingestor":"Ingestor","query":"Query"}')[matrix.component] }}
      repo: ${{ matrix.component }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: dotnet restore code
      - name: Patch version
        id: patch-version
        run: python3 deployment/patch-version.py code/${folder}Console/${folder}Console.csproj ${{ github.run_number }}
      - name: Output full version
        shell: bash
        run: |
          echo "Full version: ${{ steps.patch-version.outputs.full-version }}"
      - name: .NET Build Console
        run: dotnet build code/${folder}Console --configuration Release --no-restore
      - name: Copy binaries
        run: |
          mkdir bin
          cp -r code/${folder}Console/bin/Release/net*/* bin
      - name: Copy entrypoint
        if: matrix.component == 'experiment' || matrix.component == 'event-hub'
        run: cp deployment/docker-${repo}/entrypoint.sh bin

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Build / Push container
        run: |
          az acr build --image "${repo}/dev:${{ steps.patch-version.outputs.full-version }}" \
            --registry ${{ vars.REGISTRY_NAME }} \
            --file deployment/docker-${repo}/Dockerfile bin
      - name: Docker tag latest
        run: |
          az acr import --source "${repo}/dev:${{ steps.patch-version.outputs.full-version }}" \
            --image "${repo}/dev:latest" \
            --registry ${{ vars.REGISTRY_NAME }} --name ${{ vars.REGISTRY_NAME }} \
            --force
      - name: Keep only the two newest images
        shell: bash
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
        run: |
          digests=$(az acr manifest list-metadata \
            --registry "$REGISTRY_NAME" \
            --name "${repo}/dev" \
            --orderby time_desc \
            --query '[2:].digest' \
            --output tsv)

          while IFS= read -r digest; do
            if [[ -n "$digest" ]]; then
              az acr repository delete \
                --name "$REGISTRY_NAME" \
                --image "${repo}/dev@${digest}" \
                --yes
            fi
          done <<< "$digests"
