name: BenchmarkTest

on:
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/benchmark-test.yaml"
  push:
    branches:
      - main
    paths:
      - "code/**"
      - ".github/workflows/benchmark-test.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore code/BenchmarkTest/BenchmarkTest.csproj
      - name: Build test project
        run: >-
          dotnet build code/BenchmarkTest/BenchmarkTest.csproj
          --configuration Release --no-restore
      - name: Run unit tests
        run: >-
          dotnet test code/BenchmarkTest/BenchmarkTest.csproj
          --configuration Release --no-build --no-restore
