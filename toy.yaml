templateDbUri: "https://example.kusto.windows.net"
templateName: "example-template"
containerAppId: "/subscriptions/example/resourceGroups/example/providers/Microsoft.App/containerApps/example-app"
runtime:
  subExperimentDuration: "00:10:00"
  maxThroughputPerNode: 800
  throughputPrecision: 0.05
  maxSubExperimentCount: 12
subExperiments:
  - subExperimentName: "example-sub"
    ingestionDbUri: "https://example.kusto.windows.net"
    ingestionTable: "ExampleTable"
    eventHubConnectionString: "Endpoint=sb://example.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=example;EntityPath=example"
    throughputTargetStart: 100
